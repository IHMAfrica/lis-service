spring:
  main:
    web-application-type: reactive
  application:
    name: lis-service
  webflux:
    multipart:
      max-parts: 100
      max-in-memory-size: 10MB
      max-disk-usage-per-part: 30MB
  http:
    codecs:
      max-in-memory-size: 10MB
  jackson:
    date-format: yyyy-MM-dd
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: NON_NULL
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
  cache:
    type: caffeine
    caffeine:
      spec: "maximumSize=1000,expireAfterAccess=60s,initialCapacity=1000"
  sql:
    init:
      mode: never
logging:
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n]"
  level:
    root: INFO
    zm.gov.moh.lisservice.disa: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ""
          issuer-uri: ""
  keycloak:
    client-id: ""
  r2dbc:
    username: did_user
    password: did_password
    url: r2dbc:postgresql://localhost:5432/lis_db
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://localhost:5432/lis_db
    user: did_user
    password: did_password
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ""
    jaas-config: ""
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 10
    topic:
      lab-order: lab-orders-test
      lab-orders-ack: lab-orders-ack
      lab-results: lab-results
      lab-results-ack: lab-results-ack
server:
  port: 9010
---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID}
  r2dbc:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE}
      max-size: ${DB_POOL_MAX_SIZE}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME}
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    jaas-config: ${KAFKA_JAAS_CONFIG}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 10
    topic:
      lab-order: ${LAB_ORDER_TOPIC}
      lab-orders-ack: ${LAB_ORDERS_ACK_TOPIC}
      lab-results: ${LAB_RESULTS_TOPIC}
      lab-results-ack: ${LAB_RESULTS_ACK_TOPIC}
server:
  port: ${SERVER_PORT}