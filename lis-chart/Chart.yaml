apiVersion: v2
name: lis-chart
description: Laboratory Information System (LIS) — reactive Spring Boot service integrating with DISA*LAB over Kafka (HL7 v2.5) and gRPC.
type: application

# Bundled PostgreSQL (persisted) and Redis (ephemeral) are rendered from in-chart
# templates guarded by .Values.postgresql.enabled / .Values.redis.enabled, so this
# chart has no external repository dependencies. Kafka is expected to be provided
# externally and is configured via connection values only.

# Chart version — bump on every change to the chart or its templates.
version: 0.1.0

# Version of the LIS application shipped by this chart; used as the default image tag.
appVersion: "1.0.0"

keywords:
  - lis
  - laboratory
  - hl7
  - spring-boot
  - grpc

sources:
  - https://github.com/moh-zm/lis

maintainers:
  - name: MoH Zambia — LIS Team
