{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lis-chart.fullname" . }}-postgresql-init
  labels:
    {{- include "lis-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  01-setup-configs.sh: |
    #!/bin/bash
    set -e

    echo "Setting up PostgreSQL configuration files..."

    # Append custom PostgreSQL settings
    if [ -f /docker-entrypoint-initdb.d/postgresql-custom.conf ]; then
      echo "" >> "$PGDATA/postgresql.conf"
      echo "# Custom configurations" >> "$PGDATA/postgresql.conf"
      cat /docker-entrypoint-initdb.d/postgresql-custom.conf >> "$PGDATA/postgresql.conf"
      echo "Custom PostgreSQL configuration applied."
    fi

    # Append custom pg_hba settings
    if [ -f /docker-entrypoint-initdb.d/pg_hba-custom.conf ]; then
      echo "" >> "$PGDATA/pg_hba.conf"
      echo "# Custom HBA rules" >> "$PGDATA/pg_hba.conf"
      cat /docker-entrypoint-initdb.d/pg_hba-custom.conf >> "$PGDATA/pg_hba.conf"
      echo "Custom pg_hba configuration applied."
    fi

  02-create-debezium-user.sh: |
    #!/bin/bash
    set -e

    echo "Creating debezium_user role..."

    # Check if DEBEZIUM_PASSWORD is set
    if [ -z "$DEBEZIUM_PASSWORD" ]; then
      echo "WARNING: DEBEZIUM_PASSWORD not set, skipping debezium user creation"
      exit 0
    fi

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'debezium_user') THEN
          CREATE ROLE debezium_user WITH REPLICATION LOGIN PASSWORD '${DEBEZIUM_PASSWORD}';

          GRANT USAGE ON SCHEMA public TO debezium_user;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO debezium_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO debezium_user;

          RAISE NOTICE 'Debezium user created successfully!';
        ELSE
          RAISE NOTICE 'Debezium user already exists, skipping creation.';
        END IF;
      END
      \$\$;
    EOSQL

    echo "Debezium setup complete!"
    {{- end }}